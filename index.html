<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Field Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <canvas id="fieldCanvas"></canvas>

    <div id="ui-container">
        <h1>Vector Field</h1>

        <div class="control-group">
            <label>Add Charge Type</label>
            <div class="toggle-group">
                <button id="btn-pos" class="active" data-type="1">+ Positive</button>
                <button id="btn-neg" data-type="-1">- Negative</button>
            </div>
        </div>

        <div class="control-group">
            <label for="grid-density">Grid Spacing: <span id="val-density">40</span>px</label>
            <input type="range" id="grid-density" min="10" max="100" value="40">
        </div>

        <div class="control-group">
            <label for="field-threshold">Min Field Strength: <span id="val-threshold">0.1</span></label>
            <input type="range" id="field-threshold" min="0" max="2" step="0.05" value="0.1">
        </div>

        <div class="control-group">
            <label for="arrow-scale">Vector Scale: <span id="val-scale">1.0</span>x</label>
            <input type="range" id="arrow-scale" min="0.1" max="3" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="show-heatmap">
                Show Field Magnitude (Heatmap)
            </label>
        </div>

        <button id="btn-clear" class="danger-btn">Clear All</button>

        <div class="instructions">
            <p>Click on canvas to add charges.</p>
            <p>Drag to move (Coming soon).</p>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
