<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Field Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <canvas id="fieldCanvas"></canvas>

    <div id="ui-container">
        <h1>Vector Field Visualizer</h1>

        <div class="control-group" style="margin-bottom: 20px;">
            <div class="toggle-group">
                <button id="main-tab-charges" class="active" data-main-tab="charges">Electric Charges</button>
                <button id="main-tab-equation" data-main-tab="equation">Equation Input</button>
            </div>
        </div>

        <!-- Electric Charges Logic -->
        <div id="tab-content-charges">
            <div class="control-group">
                <div class="toggle-group">
                    <button id="tab-vector" class="active" data-mode="vector">Vector Grid</button>
                    <button id="tab-lines" data-mode="lines">Field Lines</button>
                </div>
            </div>

            <div class="control-group">
                <label>Add Charge Type</label>
                <div class="toggle-group">
                    <button id="btn-pos" class="active" data-type="1">+ Positive</button>
                    <button id="btn-neg" data-type="-1">- Negative</button>
                </div>

                <div id="strength-control-group">
                    <label for="charge-strength" style="margin-top: 10px;">Strength: <input type="number"
                            id="val-strength" value="1" min="1" max="10" class="num-input">uC</label>
                    <input type="range" id="charge-strength" min="1" max="10" step="1" value="1">
                </div>
            </div>
            <div id="controls-vector-charges">
                <div class="control-group">
                    <label for="grid-density-charges">Field Spacing: <input type="number" id="val-density-charges"
                            value="40" class="num-input">px</label>
                    <input type="range" id="grid-density-charges" min="5" max="100" value="40">
                </div>

                <div class="control-group">
                    <label for="field-threshold">Min Field Strength: <input type="number" id="val-threshold" value="0.1"
                            step="0.05" class="num-input"></label>
                    <input type="range" id="field-threshold" min="0" max="2" step="0.05" value="0.1">
                </div>

                <div class="control-group">
                    <label for="arrow-scale-charges">Vector Scale: <input type="number" id="val-scale-charges"
                            value="1.0" step="0.1" class="num-input">x</label>
                    <input type="range" id="arrow-scale-charges" min="0.1" max="3" step="0.1" value="1.0">
                </div>
            </div>
        </div>

        <!-- Equation Input Logic -->
        <div id="tab-content-equation" style="display: none;">
            <div class="control-group">
                <label>Vector Field Equation<br>F(x, y) = &lt;Ex, Ey&gt;</label>
                <div class="input-group">
                    <label>Ex = <input type="text" id="eq-ex" value="y" placeholder="sin(y)"></label>
                </div>
                <div class="input-group" style="margin-top: 5px;">
                    <label>Ey = <input type="text" id="eq-ey" value="-x" placeholder="cos(x)"></label>
                </div>
                <p class="hint">Use x, y, sin, cos, pow, etc.</p>
                <button id="btn-update-equation" style="width: 100%; margin-top: 10px;">Update Field</button>
            </div>

            <div class="control-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="show-grid-lines" checked>
                    Show Grid Lines
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="show-axes" checked>
                    Show Axes
                </label>
            </div>
            <div class="control-group">
                <label for="grid-density-equation">Field Spacing: <input type="number" id="val-density-equation"
                        value="1.0" step="0.2" class="num-input"> Units</label>
                <input type="range" id="grid-density-equation" min="0.2" max="5.0" step="0.2" value="1.0">
            </div>

            <div class="control-group">
                <label for="arrow-scale-equation">Vector Scale: <input type="number" id="val-scale-equation" value="1.0"
                        step="0.1" class="num-input">x</label>
                <input type="range" id="arrow-scale-equation" min="0.1" max="3" step="0.1" value="1.0">
            </div>
        </div>

        <!-- Field Lines Mode Controls -->
        <div id="controls-lines" style="display: none;">
            <div class="control-group">
                <label for="line-density">Lines per Charge: <input type="number" id="val-lines" value="8"
                        class="num-input"></label>
                <input type="range" id="line-density" min="4" max="32" step="1" value="8">
            </div>
        </div>

        <div class="control-group" id="controls-heatmap">
            <label class="checkbox-label">
                <input type="checkbox" id="show-heatmap">
                Show Field Magnitude as Heatmap (Log Scale)
            </label>
        </div>

        <button id="btn-clear" class="danger-btn">Clear All</button>

        <div class="instructions">
            <p>Click on canvas to add charges.</p>
            <p>Click and drag to move charges.</p>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
